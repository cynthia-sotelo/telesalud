name: CI

on:
  push:
    branches: [main]
  pull_request:

# Si llega un push nuevo a la misma rama, se cancela la corrida anterior que sigue en curso.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Los jobs usan ubuntu-24.04 y no ubuntu-latest a proposito: GitHub va a mover "latest" a
# Ubuntu 26 y conviene elegir cuando migrar, en vez de que el pipeline cambie solo.

jobs:
  backend-tests:
    name: Backend (JUnit + MockMvc)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Usan H2 en memoria: no necesitan MySQL.
      - name: Tests del backend
        working-directory: api
        run: ./mvnw -B test

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  # Levanta el sistema completo (MySQL + backend + frontend) y corre contra ese sistema
  # la coleccion de Postman con Newman y la suite de Playwright.
  integration:
    name: Integración (Newman + Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: telesalud
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Empaquetar el backend
        working-directory: api
        run: ./mvnw -B -DskipTests package

      # Hibernate crea las tablas al arrancar, por eso el backend se levanta ANTES de
      # cargar las especialidades. El proceso queda corriendo en segundo plano.
      - name: Levantar el backend
        working-directory: api
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_NAME: telesalud
          DB_USER: root
          DB_PASSWORD: root
          JWT_SECRET: clave-solo-para-ci-no-es-un-secreto-real
        run: |
          nohup java -jar target/*.jar > ../backend.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8081/api/specialties > /dev/null; then
              echo "Backend listo"
              exit 0
            fi
            sleep 3
          done
          echo "El backend no levantó a tiempo"
          cat ../backend.log
          exit 1

      - name: Cargar las especialidades de prueba
        run: |
          command -v mysql > /dev/null || (sudo apt-get update && sudo apt-get install -y mysql-client)
          mysql --default-character-set=utf8mb4 -h 127.0.0.1 -P 3306 -u root -proot telesalud < qa/sql/seed-specialties.sql

      - name: Colección de Postman con Newman
        run: >-
          npx --yes newman@6 run qa/postman/TeleSalud.postman_collection.json
          -e qa/postman/TeleSalud.postman_environment.json
          --reporters cli

      - name: Construir y levantar el frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
          nohup npx vite preview --port 5174 --strictPort > ../frontend.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5174 > /dev/null; then
              echo "Frontend listo"
              exit 0
            fi
            sleep 2
          done
          echo "El frontend no levantó a tiempo"
          cat ../frontend.log
          exit 1

      - name: Instalar Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Tests de Playwright (UI y API)
        working-directory: e2e
        run: npx playwright test

      # El reporte se sube siempre, haya pasado o fallado: tiene las trazas para diagnosticar.
      - name: Subir el reporte de Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14

      - name: Subir logs y resultados si algo falló
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: logs-de-diagnostico
          path: |
            backend.log
            frontend.log
            e2e/test-results/
          retention-days: 14
