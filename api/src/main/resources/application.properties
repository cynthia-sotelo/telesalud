spring.application.name=telesalud-api
server.port=8081

application-description=API de telemedicina para conectar pacientes con especialistas (MVP de portfolio QA)
application-version=0.0.1

# Base de datos MySQL local (ver README para como crear el esquema en Workbench)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:telesalud}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Spring Data JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false

server.error.include-message=always
logging.level.org.hibernate.SQL=error
logging.level.org.springframework=error

# JWT
jwt.secret=${JWT_SECRET:change-this-secret-in-your-local-env-file}
jwt.expiration-ms=86400000
